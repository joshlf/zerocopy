name: Rewrite PR authorship disclosures

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-docs-overhaul
          fetch-depth: 0

      - name: Rewrite commit messages
        env:
          BASE_SHA: 54aa994627b537d40d560af6296d42c424587c10
        run: |
          set -euo pipefail

          git checkout -B agent-docs-overhaul origin/agent-docs-overhaul

          cat >/tmp/rewrite_message.py <<'PY'
          import sys

          prefix = "Agent-authored-by: AI agent acting on joshlf"
          message = sys.stdin.read().rstrip()
          lines = [line for line in message.splitlines()
                   if not line.startswith(prefix)]
          message = "\n".join(lines).rstrip()

          suffix = ""
          if message.startswith("Sync fork with upstream main"):
              suffix = " (commit message only)"

          sys.stdout.write(message)
          sys.stdout.write("\n\n")
          sys.stdout.write(
              "Agent-authored-by: AI agent acting on joshlf's behalf"
              + suffix
              + "\n"
          )
          PY

          FILTER_BRANCH_SQUELCH_WARNING=1 \
            git filter-branch -f \
              --msg-filter 'python3 /tmp/rewrite_message.py' \
              "$BASE_SHA..agent-docs-overhaul"

          git push --force-with-lease origin agent-docs-overhaul
